[project]
name = "api"
version = "0.1.0"
description = "Service FastAPI : assemble les modules et sert le front"
requires-python = ">=3.11"
dependencies = [
    "audio-capture",
    "distance-estimation",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
audio-capture = { workspace = true }
distance-estimation = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
