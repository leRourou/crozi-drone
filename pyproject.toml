# Workspace uv : un package par module (packages/*) + le service qui les assemble (services/*).
[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/audio-capture/tests",
    "packages/distance-estimation/tests",
    "packages/localization/tests",
    "services/api/tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["audio_capture", "distance_estimation", "localization", "api"]
